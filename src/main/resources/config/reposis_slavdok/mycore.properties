# The following properties are required for slavdok (productive) deployment.
# For productive deployment, all properties must be configured or enabled.
# Only relevant properties should be listed here; otherwise, they should be deleted.
# Unless otherwise specified, empty properties are relevant and must be configured.
# Temporary disabled properties require further configuration or other dependencies.

##############################################################################
# Basic                                                                      #
##############################################################################
# Configure base url, e.g. http://domain:port, without '/'. Temporary disabled to use default.
#MCR.baseurl=
# Requires MCR.baseurl, therefore temporary disabled.
#MIR.CanonicalBaseURL=%MCR.baseurl%/
MCR.NameOfProject=SlavDok
MIR.projectid.default=slavdok
MIR.testEnvironment=false

##############################################################################
# Access Control                                                             #
##############################################################################
MCR.ACL.AccessKey.Strategy.AllowedObjectTypes=mods,derivate
MCR.ACL.AccessKey.Strategy.AllowedSessionPermissionTypes=read,writedb

MIR.Access.Strategy.Classifications=mir_access,state

# Grant author all permissions while a document is in state new.
MCR.Access.Strategy.CreatorPermissions=read,writedb,view-derivate,deletedb

# Allow the following user roles to search after all objects.
MIR.OwnerStrategy.AllowedRolesForSearch=admin,editor,submitter

##############################################################################
# Email                                                                      #
##############################################################################
MCR.Mail.Server=
# General sender mail address, e.g. mail@domain
MCR.Mail.Sender=

# Mail for events including self registration, e.g. <name> mail@domain
MCR.mir-module.EditorMail=
# Sender email for events, e.g. <name> mail@domain
MCR.mir-module.MailSender=

##############################################################################
# DOI                                                                        #
##############################################################################
MCR.DOI.Prefix=10.48712
MCR.DOI.HostingInstitution=Fachinformationsdienst Slavistik

# Configuration is required, therefore service temporary disabled.
#MCR.PI.Service.Datacite=org.mycore.pi.doi.MCRDOIService
MCR.PI.Service.Datacite.MetadataService=MODSDOI
MCR.PI.Service.Datacite.RegisterBaseURL=%MCR.baseurl%
MCR.PI.Service.Datacite.Username=
MCR.PI.Service.Datacite.Password=
MCR.PI.Service.Datacite.RegisterURLContext=receive/$ID
MCR.PI.Service.Datacite.RegistrationPredicate=org.mycore.pi.condition.MCRPIPublishedPredicate
MCR.PI.Service.Datacite.Transformer=datacite
MCR.PI.Service.Datacite.Generator=slavdokDOI

MCR.PI.Generator.slavdokDOI=org.mycore.pi.MCRGenericPIGenerator
MCR.PI.Generator.slavdokDOI.GeneralPattern=%MCR.DOI.Prefix%/$ObjectDate-$Count
MCR.PI.Generator.slavdokDOI.DateFormat=yyyyMMdd
MCR.PI.Generator.slavdokDOI.CountPrecision=3
MCR.PI.Generator.slavdokDOI.Type=doi

##############################################################################
# OAI Data Provider                                                          #
##############################################################################
MCR.OAIDataProvider.OAI2.RepositoryName=SlavDok - Open-Access Repositorium f\u00FCr Slawistik
MCR.OAIDataProvider.OAI2.RepositoryIdentifier=%MCR.baseurl%/
MCR.OAIDataProvider.OAI2.AdminEmail=
MCR.OAIDataProvider.OAI2.RecordSampleID=%MIR.projectid.default%_mods_00000321
MCR.OAIDataProvider.OAI2.DescriptionURI.EPrints=webapp:oai/oai-eprints.xml
MCR.OAIDataProvider.OAI2.DescriptionURI.Rights=webapp:oai/oai-rights.xml
MCR.OAIDataProvider.OAI2.DeletedRecord=transient

MCR.OAIDataProvider.RepositoryPublisherAddress=
MCR.OAIDataProvider.RepositoryPublisherName=
MCR.OAIDataProvider.RepositoryPublisherPlace=

# Switch to DINI2022 conformity.
MIR.xMetaDissPlus.diniPublType.classificationId=diniPublType2022
MIR.dc.diniPublType.classificationId=diniPublType2022
MIR.dc.ignoredClassificationIds=diniPublType
MCR.OAIDataProvider.OAI2.Sets.doc-type.URI=xslStyle:classification2sets:classification:metadata:2:children:diniPublType2022
MCR.OAIDataProvider.OAI2.Sets.doc-type.Classification=diniPublType2022

MCR.OAIDataProvider.OAI2.Friends.OpenAgrar=https://openagrar.bmel-forschung.de/servlets/OAIDataProvider
MCR.OAIDataProvider.OAI2.Friends.DuEPublico=https://duepublico.uni-duisburg-essen.de/servlets/OAIDataProvider
MCR.OAIDataProvider.OAI2.Friends.DBThueringen=https://www.db-thueringen.de/servlets/OAIDataProvider
MCR.OAIDataProvider.OAI2.Friends.RosDok=https://rosdok.uni-rostock.de/oai

##############################################################################
# ePuSta                                                                     #
##############################################################################
# ePuSta endpoint is required, therefore temporarily disabled.
#MIR.ePuSta=show
MIR.ePuSta.providerURL=

##############################################################################
# Editor                                                                     #
##############################################################################
MIR.EditorForms.CustomIncludes=%MIR.EditorForms.CustomIncludes%,xslStyle:editor/mir2xeditor:webapp:editor/editor-customization.xed

##############################################################################
# Frontend                                                                   #
##############################################################################
MIR.CustomLayout.JS=slavdok.js
# Additional style sheets.
MCR.URIResolver.xslIncludes.MyCoReWebPage=%MCR.URIResolver.xslIncludes.MyCoReWebPage%,slavdok-index-templates.xsl,slavdok-dashboard-templates.xsl

##############################################################################
# Citation                                                                   #
##############################################################################
MIR.citationStyles=modern-language-association,apa,bibtex,modern
MIR.defaultCitationStyle=modern-language-association
MCR.Export.CSL.Styles=%MIR.citationStyles%

##############################################################################
# Solr                                                                       #
##############################################################################
MCR.Solr.Proxy.WhiteList=%MCR.Solr.Proxy.WhiteList%,/selectPublic,/findPublic
MCR.Solr.NestedDocuments=true
MIR.Rules.Solr.Protected.RequestHandler=find,select

##############################################################################
# Enrichment                                                                 #
##############################################################################
MCR.MODS.EnrichmentResolver.DataSources.import=(Scopus PubMed IEEE CrossRef DataCite) OADOI GBV ZDB JOP

##############################################################################
# Workflow                                                                   #
##############################################################################
MIR.Workflow.Menu=true
MIR.Workflow.Box=true

##############################################################################
# Misc                                                                       #
##############################################################################
MCR.URIResolver.Classification.Sort.base_classification=false
MIR.Matomo=true
